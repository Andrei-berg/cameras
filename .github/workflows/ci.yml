name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Better Auth создаёт new Resend(...) на уровне модуля — сборка падает без ключа.
          # Секрет опционален: если не задан, подставляется dummy (сборка БД не трогает).
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 're_123' }}
